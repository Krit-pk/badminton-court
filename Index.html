<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองคอร์ทแบดมินตัน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK (Auth และ Database) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- หน้าเข้าสู่ระบบ / สมัครสมาชิก -->
    <div id="loginPage" class="page-viewport">
        <div class="login-box">
            <h2 id="authTitle">เข้าสู่ระบบจองคอร์ท</h2>
            
            <div class="input-group">
                <label id="inputIdentifierLabel">ชื่อผู้ใช้งาน หรือ อีเมล (Username / Email)</label>
                <input type="text" id="loginIdentifier" placeholder="กรอก Username หรือ Email ของคุณ">
            </div>
            
            <div class="input-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="loginPassword" placeholder="รหัสผ่านอย่างน้อย 6 ตัวอักษร">
            </div>

            <!-- ช่องกรอกชื่อเล่น (แสดงเฉพาะตอนสมัครสมาชิก) -->
            <div class="input-group hidden" id="usernameGroup">
                <label>ชื่อที่ใช้แสดงในคอร์ท (Username)</label>
                <input type="text" id="loginUsername" placeholder="กรอกชื่อเล่นหรือชื่อผู้ใช้">
            </div>

            <button class="submit-btn" id="authSubmitBtn" onclick="handleAuthAction()">เข้าสู่ระบบ</button>
            
            <p class="auth-switch-text" style="text-align:center; margin-top:14px; font-size:13px; cursor:pointer; color:#185A52;" onclick="toggleAuthMode()">
                <span id="switchText">ยังไม่มีบัญชีใช่ไหม? สมัครสมาชิกที่นี่</span>
            </p>
        </div>
    </div>

    <!-- หน้าหลักผู้ใช้ -->
    <div id="userPage" class="page-viewport hidden">
        <header class="header green-header">
            <h1>จองคอร์ท</h1>
            <div class="user-info">
                <span>ผู้ใช้: <strong id="currentUserDisplay">-</strong></span>
                <button class="admin-btn hidden" id="adminNavBtn" onclick="goToAdmin()">Admin</button>
                <button class="logout-btn" onclick="handleLogout()">ออกจากระบบ</button>
            </div>
        </header>

        <main class="content-viewport">
            <div class="court-grid-fullscreen">
                <div class="court-card" onclick="openPopup('คอร์ท 1')">คอร์ท 1</div>
                <div class="court-card" onclick="openPopup('คอร์ท 2')">คอร์ท 2</div>
                <div class="court-card" onclick="openPopup('คอร์ท 3')">คอร์ท 3</div>
                <div class="court-card" onclick="openPopup('คอร์ท 4')">คอร์ท 4</div>
            </div>
        </main>
    </div>

    <!-- ป๊อปอัพแสดงคิวจอง -->
    <div id="courtModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modalTitle">คอร์ท 1</h2>
            <p class="modal-subtitle">คลิกที่ช่องว่างเพื่อลงชื่อจองด้วยบัญชีของคุณ</p>
            <div class="queue-list" id="queueListContainer"></div>
            <button class="close-btn" onclick="closePopup()">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- หน้า Admin -->
    <div id="adminPage" class="page-viewport hidden">
        <header class="header black-header">
            <h1>Admin Management</h1>
            <button class="user-btn" onclick="goToUser()">กลับหน้าจอง</button>
        </header>

        <main class="content-viewport">
            <div class="admin-panel-fullscreen" id="adminPanelContainer"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
